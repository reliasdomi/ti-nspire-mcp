[project]
name = "ti-nspire-mcp"
version = "0.1.0"
description = "Servidor Model Context Protocol (MCP) para calculadoras Texas Instruments (TI-Nspire CX II)"
readme = "README.md"
authors = [
    { name = "Rubén Elías", email = "al24206161@chapingo.mx" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "pyusb>=1.3.1",
]

[project.scripts]
ti-nspire-mcp = "ti_nspire_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
