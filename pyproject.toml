[project]
name = "ti-nspire-mcp"
version = "0.2.0"
description = "Servidor Model Context Protocol (MCP 2.0) para calculadoras Texas Instruments (TI-Nspire CX II) con protocolo USB NavNet, generador .tns multipágina, conversor LaTeX y puente inalámbrico ESP32"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rubén Elías", email = "al24206161@chapingo.mx" }
]
keywords = ["mcp", "ti-nspire", "texas-instruments", "calculator", "navnet", "micropython", "esp32", "usb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pillow>=13.0.0",
    "pydantic>=2.10.0",
    "pyusb>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/reliasdomi/ti-nspire-mcp"
Repository = "https://github.com/reliasdomi/ti-nspire-mcp"
Issues = "https://github.com/reliasdomi/ti-nspire-mcp/issues"

[project.scripts]
ti-nspire-mcp = "ti_nspire_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["ti_nspire_mcp"]

[[tool.mypy.overrides]]
module = ["usb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_default_fixture_loop_scope = "function"
